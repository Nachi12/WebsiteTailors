<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" class="principle-svg principle-svg-03" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <style>
      .p-stroke { stroke: var(--ill-stroke, #14161A); stroke-width: 1.75; }
      .p-stroke-thin { stroke: var(--ill-stroke, #14161A); stroke-width: 1.2; }
      .p-muted { stroke: var(--ill-muted, #5B6068); stroke-width: 1.2; }
      .p-paper { fill: var(--ill-paper, #FFFFFF); }
      .p-lime { fill: var(--ill-lime, #C8F03C); }
      .p-lime-stroke { stroke: var(--ill-lime, #C8F03C); stroke-width: 1.75; }
      .p-glow { fill: var(--ill-lime, #C8F03C); opacity: 0.18; }
    </style>
  </defs>

  <!-- Ambient Glow Behind Phone & Message -->
  <rect x="146" y="16" width="84" height="150" rx="16" class="p-glow" />

  <!-- 1. WEBSITE ENQUIRY FORM / MODAL (Left Side) -->
  <g class="ill-enquiry-card">
    <!-- Form Card Base -->
    <rect x="12" y="24" width="108" height="130" rx="10" class="p-paper p-stroke" />

    <!-- Form Top Bar -->
    <line x1="12" y1="44" x2="120" y2="44" class="p-stroke" />
    <!-- Three Minimal Window Dots -->
    <circle cx="22" cy="34" r="2.2" class="p-stroke" />
    <circle cx="29" cy="34" r="2.2" class="p-stroke" />
    <circle cx="36" cy="34" r="2.2" class="p-lime p-stroke" />
    <!-- 'ENQUIRY FORM' Label Pill -->
    <rect x="48" y="28" width="64" height="12" rx="6" class="p-paper p-stroke-thin" />
    <line x1="56" y1="34" x2="102" y2="34" class="p-stroke-thin" />

    <!-- Form Fields Inside Card -->
    <!-- Name Field -->
    <rect x="20" y="52" width="92" height="16" rx="4" class="p-paper p-stroke-thin" />
    <circle cx="28" cy="60" r="3" class="p-muted" />
    <line x1="36" y1="60" x2="84" y2="60" class="p-muted" />

    <!-- Phone / WhatsApp Number Field -->
    <rect x="20" y="73" width="92" height="16" rx="4" class="p-paper p-stroke-thin" />
    <!-- Phone / Dial Icon -->
    <path d="M 26 79 C 26 83, 29 85, 31 85" class="p-muted" />
    <line x1="36" y1="81" x2="96" y2="81" class="p-muted" stroke-dasharray="2 1.5" />

    <!-- Requirement / Message Box -->
    <rect x="20" y="94" width="92" height="28" rx="4" class="p-paper p-stroke-thin" />
    <line x1="26" y1="102" x2="102" y2="102" class="p-stroke-thin" stroke-width="1.4" />
    <line x1="26" y1="109" x2="88" y2="109" class="p-stroke-thin" stroke-width="1.4" />
    <line x1="26" y1="115" x2="68" y2="115" class="p-muted" />

    <!-- 'SEND TO WHATSAPP' Button with Click Cursor -->
    <g class="ill-send-button">
      <rect x="20" y="128" width="92" height="18" rx="9" class="p-lime p-stroke" />
      <!-- WhatsApp Logo / Chat Icon -->
      <circle cx="32" cy="137" r="4.2" fill="#14161A" />
      <path d="M 30 139 L 31.5 137.5" stroke="#C8F03C" stroke-width="1.2" />
      <!-- 'SEND ENQUIRY ↗' Line -->
      <line x1="42" y1="137" x2="98" y2="137" stroke="#14161A" stroke-width="2" />
      <path d="M 101 134 L 105 134 L 105 138 M 105 134 L 100 139" stroke="#14161A" stroke-width="1.4" />
    </g>
  </g>

  <!-- 2. SMOOTH ENQUIRY FLOW TRAJECTORY TO SMARTPHONE -->
  <g class="ill-flow-bridge">
    <!-- Fluid Curved Flow Line from Website Button to Mobile Chat -->
    <path d="M 112 137 C 132 137, 134 88, 150 88" class="p-lime-stroke" stroke-width="2.4" stroke-dasharray="4 3" />
    
    <!-- Flow Motion Particles -->
    <circle cx="122" cy="128" r="2" class="p-lime" stroke="#14161A" stroke-width="1" />
    <circle cx="132" cy="106" r="2.5" class="p-lime" stroke="#14161A" stroke-width="1" />
    <circle cx="142" cy="94" r="2" class="p-lime" stroke="#14161A" stroke-width="1" />

    <!-- 'INSTANT' / 'TIME SAVER' Pill Badge -->
    <g class="ill-speed-tag">
      <rect x="116" y="60" width="36" height="15" rx="7.5" class="p-paper p-stroke-thin" />
      <!-- Lightning bolt / clock hand -->
      <path d="M 124 64 L 122 68 L 125 68 L 123 71 L 127 66 L 124.5 66 Z" class="p-lime" stroke="#14161A" stroke-width="0.6" />
      <line x1="129" y1="67.5" x2="146" y2="67.5" stroke="#14161A" stroke-width="1.4" />
    </g>
  </g>

  <!-- 3. SMARTPHONE RUNNING WHATSAPP CONVERSATION (Right Side) -->
  <g class="ill-phone">
    <!-- Phone Chassis -->
    <rect x="152" y="16" width="76" height="152" rx="14" class="p-paper p-stroke" stroke-width="2" />
    
    <!-- Screen Bezel -->
    <rect x="156" y="24" width="68" height="136" rx="9" fill="#F6F4EF" class="p-stroke-thin" />

    <!-- Top Speaker Notch -->
    <line x1="180" y1="20" x2="200" y2="20" class="p-stroke" stroke-width="1.8" />
    <circle cx="204" cy="20" r="1.2" fill="#14161A" />

    <!-- WhatsApp App Top Header Bar -->
    <rect x="156" y="24" width="68" height="22" rx="0" class="p-paper" />
    <line x1="156" y1="46" x2="224" y2="46" class="p-stroke-thin" />
    <!-- Back arrow -->
    <path d="M 163 35 L 160 35 M 161.5 33.5 L 160 35 L 161.5 36.5" class="p-stroke-thin" />
    <!-- Contact Profile Avatar -->
    <circle cx="170" cy="35" r="5.5" class="p-lime p-stroke-thin" />
    <circle cx="170" cy="33.5" r="2" fill="#14161A" />
    <path d="M 166.5 38.5 Q 170 36.5 173.5 38.5" class="p-stroke-thin" fill="none" />
    <!-- Contact Name & 'Online' Dot -->
    <line x1="178" y1="33" x2="204" y2="33" class="p-stroke-thin" stroke-width="1.6" />
    <circle cx="179" cy="39" r="1.2" fill="#25D366" />
    <line x1="183" y1="39" x2="208" y2="39" class="p-muted" stroke-width="1" />

    <!-- Active Incoming Lead Message Bubble (WhatsApp Style with Lime Fill) -->
    <g class="ill-chat-incoming">
      <!-- Bubble Shape with Tail pointing left -->
      <path d="M 164 56 C 164 53, 166 52, 169 52 L 214 52 C 217 52, 219 53, 219 56 L 219 86 C 219 89, 217 90, 214 90 L 169 90 C 166 90, 164 89, 164 86 L 164 64 L 160 60 L 164 58 Z" class="p-lime p-stroke" />
      
      <!-- '✦ NEW ENQUIRY' Tag inside bubble -->
      <line x1="170" y1="60" x2="208" y2="60" stroke="#14161A" stroke-width="2" />
      <line x1="170" y1="68" x2="212" y2="68" stroke="#14161A" stroke-width="1.3" />
      <line x1="170" y1="74" x2="198" y2="74" stroke="#14161A" stroke-width="1.3" />

      <!-- WhatsApp Double Checkmarks ✓✓ and Time -->
      <line x1="170" y1="82" x2="190" y2="82" stroke="#14161A" stroke-width="1" opacity="0.6" />
      <!-- Double Checkmark -->
      <path d="M 206 82 L 208 84 L 212 79 M 209 82 L 211 84 L 215 79" stroke="#14161A" stroke-width="1.2" fill="none" />
    </g>

    <!-- Outgoing Instant Follow-Up Response Bubble -->
    <g class="ill-chat-outgoing">
      <rect x="170" y="98" width="50" height="26" rx="6" class="p-paper p-stroke-thin" />
      <!-- Outgoing bubble tail -->
      <path d="M 220 106 L 223 108 L 220 111 Z" class="p-paper p-stroke-thin" />
      <line x1="176" y1="106" x2="212" y2="106" class="p-stroke-thin" stroke-width="1.4" />
      <line x1="176" y1="113" x2="202" y2="113" class="p-stroke-thin" stroke-width="1.4" />
      <!-- Blue / Double checkmarks ✓✓ -->
      <path d="M 206 118 L 208 120 L 212 116 M 209 118 L 211 120 L 215 116" stroke="#1F5C4A" stroke-width="1.1" fill="none" />
    </g>

    <!-- Quick Action Follow-Up Chip: 'Call Client ↗' -->
    <g class="ill-quick-chip">
      <rect x="160" y="132" width="60" height="14" rx="7" class="p-lime p-stroke-thin" />
      <line x1="166" y1="139" x2="208" y2="139" stroke="#14161A" stroke-width="1.6" />
      <path d="M 211 137 L 214 137 L 214 140 M 214 137 L 210 141" stroke="#14161A" stroke-width="1" />
    </g>

    <!-- Bottom Home Indicator -->
    <line x1="180" y1="164" x2="200" y2="164" class="p-stroke" stroke-width="2" />
  </g>

  <!-- Celebratory Efficiency Sparkles (Website Tailors ✦ Motif) -->
  <g class="ill-sparkles">
    <path d="M 230 6 Q 230 12 236 12 Q 230 12 230 18 Q 230 12 224 12 Q 230 12 230 6 Z" class="p-lime" stroke="#14161A" stroke-width="1" />
    <circle cx="106" cy="18" r="1.5" fill="#14161A" />
    <path d="M 14 12 Q 14 16 18 16 Q 14 16 14 20 Q 14 16 10 16 Q 14 16 14 12 Z" class="p-lime" stroke="#14161A" stroke-width="0.8" />
  </g>
</svg>
